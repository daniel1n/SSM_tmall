# Spring Boot 2.7.18 配置文件
# 仿天猫商城系统配置

spring:
  application:
    name: tmall-ssm

  # 数据源配置 (Druid)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tmall_ssm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: admin
    # Druid 连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j2
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # JSP 视图解析配置
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # 静态资源路径配置
  resources:
    static-locations: classpath:/static/,file:./images/

# MyBatis 配置
mybatis:
  # Mapper XML 文件路径
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类别名包路径
  type-aliases-package: com.qqlin.tmall.pojo
  # MyBatis 配置
  configuration:
    # 开启下划线命名转驼峰命名 (数据库: create_date -> Java: createDate)
    map-underscore-to-camel-case: true
    # 开启延迟加载 (按需加载)
    lazy-loading-enabled: true
    # 积极加载 (避免延迟加载导致的 N+1 问题)
    aggressive-lazy-loading: false
    # 日志输出 (便于调试)
    log-impl: org.apache.commons.logging.impl.Log4JLogFactory

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 日志配置
logging:
  level:
    root: INFO
    com.qqlin.tmall: DEBUG
    com.qqlin.tmall.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  log4j:
    config: classpath:log4j.properties

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    accept-count: 100
